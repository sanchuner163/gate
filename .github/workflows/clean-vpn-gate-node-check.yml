name: Clean VPN Gate Node Check Runs
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      REPO: sanchuner163/gate
      WF_ID_VPNCHECK: 377582257
      WF_ID_SELF: 379269898
    steps:
      - name: VPN保留最新1条，Clean自身清空全部历史run
        run: |
          set -e

          # ========== 处理 VPN Gate Node Check：保留最新1条 ==========
          echo "==================== 处理 VPN Gate Node Check ID: $WF_ID_VPNCHECK ===================="
          WORKFLOW_ID="$WF_ID_VPNCHECK"
          RUN_IDS=$(gh api --paginate "/repos/$REPO/actions/workflows/$WORKFLOW_ID/runs" | jq -r '.workflow_runs[] | select(.conclusion != null) | .id')
          if [ -n "$RUN_IDS" ]; then
            RUN_ARR=($RUN_IDS)
            TOTAL=${#RUN_ARR[@]}
            echo ">> VPN工作流共 $TOTAL 条已完成记录"
            if [ "$TOTAL" -gt 1 ]; then
              for ((i=1;i<TOTAL;i++)); do
                rid=${RUN_ARR[$i]}
                echo "删除VPN旧Run: $rid"
                gh api -X DELETE "/repos/$REPO/actions/runs/$rid" || true
                sleep 0.3
              done
            fi
          else
            echo ">> VPN工作流无已完成记录"
          fi

          # ========== 处理 Clean 自身：全部删除已完成历史run ==========
          echo -e "\n==================== 处理 Clean VPN Gate Node Check Runs ID: $WF_ID_SELF ===================="
          WORKFLOW_ID="$WF_ID_SELF"
          RUN_IDS=$(gh api --paginate "/repos/$REPO/actions/workflows/$WORKFLOW_ID/runs" | jq -r '.workflow_runs[] | select(.conclusion != null) | .id')
          if [ -n "$RUN_IDS" ]; then
            RUN_ARR=($RUN_IDS)
            TOTAL=${#RUN_ARR[@]}
            echo ">> Clean工作流共 $TOTAL 条已完成记录，准备全部删除"
            for rid in "${RUN_ARR[@]}"; do
              echo "删除Clean历史Run: $rid"
              gh api -X DELETE "/repos/$REPO/actions/runs/$rid" || true
              sleep 0.3
            done
          else
            echo ">> Clean工作流无已完成历史记录"
          fi

          echo -e "\n✅ 清理流程执行完成"
